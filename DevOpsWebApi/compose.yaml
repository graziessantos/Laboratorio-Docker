services:

  staging:
    image: devops-webapi:1.1.0
    container_name: devops-api-staging
    ports:
      - "8081:8080"
    environment:
      APP_ENVIRONMENT: staging
      APP_VERSION: "1.1.0"
    healthcheck:
      test: ["CMD", "dotnet", "DevOpsWebApi.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  production:
    image: devops-webapi:1.1.0
    container_name: devops-api-prod
    ports:
      - "8082:8080"
    environment:
      APP_ENVIRONMENT: production
      APP_VERSION: "1.1.0"
    healthcheck:
      test: ["CMD", "dotnet", "DevOpsWebApi.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s